<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Bimmerparts – Ligação OLX</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f5f7; color: #1f2a44; margin: 0; padding: 24px; }
  .caixa { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin-top: 0; }
  textarea { width: 100%; height: 90px; font-size: 13px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 10px 16px; font-size: 15px; background: #1f2a44; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  .ok { color: #1b7a33; font-weight: bold; }
  .erro { color: #9c0006; font-weight: bold; }
  small { color: #666; }
</style>
</head>
<body>
<div class="caixa">
  <h1>Bimmerparts – ligação à conta OLX</h1>
  <p id="estado">A ler a resposta do OLX…</p>
  <div id="copiar" hidden>
    <p>Copie o endereço abaixo e cole-o na janela do programa <b>vigia_mensagens</b> quando ele pedir:</p>
    <textarea id="endereco" readonly></textarea>
    <button id="botao">Copiar</button> <span id="copiado"></span>
  </div>
  <p><small>Esta página não guarda nem envia nada. O código só serve uma vez e expira em poucos minutos.</small></p>
</div>
<script>
  (function () {
    var p = new URLSearchParams(window.location.search);
    var estado = document.getElementById('estado');
    if (p.get('error')) {
      estado.className = 'erro';
      estado.textContent = 'O OLX não autorizou a ligação (' + p.get('error') + '). Pode fechar esta janela e tentar de novo.';
      return;
    }
    if (!p.get('code')) {
      estado.textContent = 'Esta página só é usada para ligar a conta OLX da Bimmerparts ao programa interno.';
      return;
    }
    estado.className = 'ok';
    estado.textContent = 'Conta OLX autorizada.';
    var campo = document.getElementById('endereco');
    campo.value = window.location.href;
    document.getElementById('copiar').hidden = false;
    document.getElementById('botao').onclick = function () {
      campo.select();
      try { navigator.clipboard.writeText(campo.value); } catch (e) { document.execCommand('copy'); }
      document.getElementById('copiado').textContent = 'Copiado.';
    };
  })();
</script>
</body>
</html>
